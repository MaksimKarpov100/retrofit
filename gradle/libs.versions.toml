[versions]
agp = "9.4.1"
coilComposeVersion = "3.3.0"
converterGson = "3.0.0"
coreKtx = "1.19.1"
datastore = "1.3.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotlinxSerializationJson = "1.13.0"
lifecycleRuntimeKtx = "2.11.1"
activityCompose = "1.13.0"
kotlin = "2.4.21"
composeBom = "2026.02.00"
lifecycleViewmodelCompose = "2.11.1"
